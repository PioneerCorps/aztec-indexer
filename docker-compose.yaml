version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data2:/data/db

  indexer:
    image: bdehri/aztecexplorer-indexer:6.0.0-0.0.1
    container_name: indexer
    depends_on:
      - mongo
    environment:
      - DB_URL=mongodb://mongo:27017
      - PXE_URL=https://aztec-mainnet.drpc.org

  api:
    image: indexer-api:0.3.0
    container_name: api
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_URL=mongodb://mongo:27017

volumes:
  mongo-data2:
